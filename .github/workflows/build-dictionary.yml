name: Build dictionary

on:
  workflow_dispatch:
    inputs:
      max_words:
        description: "Maximum number of words to keep"
        default: "40000"
  push:
    paths:
      - "dictionaries/raw/**"
      - "tools/build_dictionary.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dictionaries/en.txt
        env:
          MAX_WORDS: ${{ inputs.max_words || '40000' }}
        run: |
          python3 tools/build_dictionary.py dictionaries/raw/en_50k.txt \
            -o dictionaries/en.txt --max-words "$MAX_WORDS"

      - name: Job summary (sample for eyeballing)
        run: |
          {
            echo "### Dictionary build"
            echo "Words kept: $(grep -vc '^#' dictionaries/en.txt)"
            echo
            echo "**Top 60**"
            echo '```'
            sed -n '3,62p' dictionaries/en.txt
            echo '```'
            echo "**Around line 5000**"
            echo '```'
            sed -n '5000,5040p' dictionaries/en.txt
            echo '```'
            echo "**Around line 25000**"
            echo '```'
            sed -n '25000,25040p' dictionaries/en.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: en-dictionary
          path: dictionaries/en.txt

      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dictionaries/en.txt
          if git diff --cached --quiet; then
            echo "No change to dictionaries/en.txt"
          else
            git commit -m "Rebuild dictionaries/en.txt"
            git push
          fi
